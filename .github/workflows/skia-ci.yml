# skia-ci.yml - Skia 可选后端集成验证（软件栅格化, 无窗口）
#   触发：推送 main 或手动 workflow_dispatch。
#   目的：wbwopenglapi_skia.hpp + 示例 14_skia 的真实编译/运行验证。
#   skia 端口首次安装约 15-30 分钟（大依赖），故独立于 release.yml，
#   并缓存 vcpkg/installed 加速后续运行。
#   只构建 14_skia target（无 GLFW/GL 依赖，仅链接 skia），不连锁其余示例。
name: Skia CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  skia-smoke:
    name: windows-amd64 (LLVM/clang-cl + vcpkg skia)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Cache vcpkg installed (clang 构建产物)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-skia-clang-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          save-always: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # LLVM（用户要求：Skia 用 llvm 构建，不用 MSVC）。
      # windows-latest 镜像预装 LLVM（C:\Program Files\LLVM），
      # clang-cl 即 LLVM 的前端 + MSVC ABI/运行库。
      - name: Add LLVM to PATH (clang-cl)
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Prepare clang-cl toolchain
        shell: bash
        run: |
          cat > toolchain.cmake <<'EOF'
          set(CMAKE_C_COMPILER "clang-cl")
          set(CMAKE_CXX_COMPILER "clang-cl")
          set(CMAKE_MT "mt")
          EOF
          cat toolchain.cmake

      - name: Install dependencies (vcpkg.json manifest, clang-cl)
        shell: pwsh
        env:
          VCPKG_CHAINLOAD_TOOLCHAIN_FILE: ${{ github.workspace }}/toolchain.cmake
        run: .\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Fetch GLAD (CMakeLists:28 的 glad target 需要 third_party/glad/src/gl.c)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch_deps.ps1 -SkipGLFW -SkipFreeType -SkipFiraCode

      - name: Configure (WBWOPENGAL_API_SKIA=ON, ClangCL)
        run: >
          cmake -B build -A x64 -T ClangCL -DWBWOPENGAL_API_SKIA=ON
          "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build 14_skia (Release)
        run: cmake --build build --target 14_skia --config Release

      - name: Run 14_skia (headless 像素校验 + BMP 导出)
        run: .\build\Release\14_skia.exe

      - name: Upload BMP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 14_skia.bmp
          path: test/14_skia.bmp
          if-no-files-found: error