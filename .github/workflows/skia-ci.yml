# skia-ci.yml - Skia 可选后端集成验证（软件栅格化, 无窗口）
#   触发：推送 main 或手动 workflow_dispatch。
#   目的：wbwopenglapi_skia.hpp + 示例 14_skia 的真实编译/运行验证。
#   构建方式：GN+LLVM 自建（google/skia chrome/m* 分支 + depot_tools +
#   LLVM clang + GN + ninja），全程 LLVM 无 MSVC 编译器；产物经
#   WBWOPENGAL_API_SKIA_DIR 直连 CMake（见根 CMakeLists.txt）。
#   与 release-skia.yml 的 windows-amd64 组合同链路（发布链路的先行验证）。
#   只构建 14_skia target（无 GLFW/GL 依赖，仅链接 skia），不连锁其余示例。
name: Skia CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  skia-smoke:
    name: windows-amd64 (GN + LLVM clang + vcpkg-free)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load dependency versions (config.yml)
        shell: bash
        run: python scripts/export-config.py >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Checkout Skia source (chrome stable 对应分支)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SKIA_REPO }}
          ref: ${{ env.SKIA_BRANCH }}
          path: skia

      - name: Setup depot_tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & .\depot_tools\gclient.bat

      - name: Install LLVM and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja -y --limit-output
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Visual Studio environment (clang 运行时库/头)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Fix Clang directory structure for Skia
        shell: pwsh
        run: |
          $clangDir = "C:\Program Files\LLVM"
          New-Item -ItemType Directory -Force -Path "$clangDir\lib\clang"
          $clangVersion = & "$clangDir\bin\clang.exe" --version | Select-String -Pattern "version (\d+\.\d+\.\d+)" | ForEach-Object { $_.Matches.Groups[1].Value }
          if ($clangVersion) {
            New-Item -ItemType Directory -Force -Path "$clangDir\lib\clang\$clangVersion"
            Write-Host "Created Clang version directory: $clangDir\lib\clang\$clangVersion"
          } else {
            New-Item -ItemType Directory -Force -Path "$clangDir\lib\clang\18.0.0"
          }

      - name: Cache Skia dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/skia/third_party/externals
            ${{ github.workspace }}/skia/out
          key: skia-gn-${{ env.SKIA_BRANCH }}-${{ hashFiles('skia/DEPS') }}
          save-always: true

      - name: Sync dependencies (git-sync-deps)
        working-directory: skia
        shell: cmd
        run: python tools/git-sync-deps

      - name: Generate build files with GN (LLVM x64)
        working-directory: skia
        shell: cmd
        run: |
          gn gen out/Release-x64 --args="is_debug=false is_official_build=true skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_pdf_subset_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false target_cpu=\"x64\" clang_win=\"C:\Program Files\LLVM\" win_vc=\"C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\" extra_cflags=[\"-MT\", \"-Wno-attributes\"]"

      - name: Build with Ninja
        working-directory: skia
        shell: cmd
        run: |
          ninja -C out/Release-x64 skia

      - name: "Bundle include into GN out dir (SKIA_DIR 自包含 include+libs)"
        shell: pwsh
        run: |
          $include = "${{ github.workspace }}\skia\include"
          $outDir = "${{ github.workspace }}\skia\out\Release-x64"
          Copy-Item -Recurse -Force $include "$outDir\include"
          Get-ChildItem "$outDir\include" -Directory | Select-Object -First 5 -ExpandProperty Name

      - name: Fetch GLAD sources (CMakeLists 无条件构建 glad, 仓库不含 third_party)
        shell: pwsh
        run: "& .\\scripts\\fetch_deps.ps1 -SkipGLFW -SkipFreeType -SkipFiraCode"

      - name: Configure 14_skia (WBWOPENGAL_API_SKIA_DIR 直连 GN 产物, ClangCL)
        run: >
          cmake -B build -A x64 -T ClangCL
          -DWBWOPENGAL_API_SKIA=ON
          "-DWBWOPENGAL_API_SKIA_DIR=${{ github.workspace }}\skia\out\Release-x64"

      - name: Build 14_skia (Release)
        run: cmake --build build --target 14_skia --config Release

      - name: Copy icudtl.dat (skia 运行时 ICU 数据)
        shell: pwsh
        run: Copy-Item "${{ github.workspace }}\skia\out\Release-x64\icudtl.dat" .\build\Release\

      - name: Run 14_skia (headless 像素校验 + BMP 导出)
        run: .\build\Release\14_skia.exe

      - name: Package skia (发布格式, 对齐 release-skia GN 分支布局)
        shell: bash
        run: |
          mkdir -p dist/skia/skia/include dist/skia/skia/lib dist/skia/skia/bin
          cp -f include/wbwopenglapi.hpp include/wbwopenglapi_skia.hpp dist/skia/
          cp -r skia/include dist/skia/skia/include
          cp skia/out/Release-x64/*.lib dist/skia/skia/lib/
          cp skia/out/Release-x64/icudtl.dat dist/skia/skia/bin/
          cat > dist/skia/README-SKIA.md <<'EOF'
          # wbwopenglapi-skia (LLVM 构建)
          # 内容: wbwopenglapi.hpp / wbwopenglapi_skia.hpp（可选软件栅格化后端封装）
          #      + skia/{include,lib,bin}
          #   windows-amd64: GN+LLVM 自建 google/skia chrome/m152, clang 编译, 静态 -MT
          # 用法（CMake 示例）:
          #   target_include_directories(app PRIVATE skia/include)
          #   target_compile_definitions(app PRIVATE WBWOPENGAL_API_SKIA)
          #   target_link_libraries(app PRIVATE skia/lib/skia.lib ...)
          #   icudtl.dat 需拷到运行目录（或设 SKIA_ICU_DATA_FILE）
          # 坐标/API 见 wbwopenglapi_skia.hpp 头部说明与 README.md "Skia（可选）" 章节。
          EOF
          tar -C dist/skia -czf wbwopenglapi-skia-windows-amd64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: wbw-skia-windows-amd64
          path: wbwopenglapi-skia-windows-amd64.tar.gz
          retention-days: 14

      - name: Upload BMP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 14_skia.bmp
          path: test/14_skia.bmp
          if-no-files-found: error