# release.yml - 发布工作流（核心包 + napi 包）
#   触发：推送 v* 标签（如 v0.2.0）或手动 workflow_dispatch。
#   Skia 库包在独立 workflow release-skia.yml（互不阻塞）。
#   产出（每个平台 2 个包，合并发布到 Releases）：
#     wbwopenglapi-<os>-<arch>.tar.gz         核心包：include/（header-only 库）
#                                               + CMakeLists/README + Windows x64/x86 DLL/导入库
#     wbwopenglapi-napi-<os>-<arch>.tar.gz   Node 插件：build/*.node（+ 平台 DLL）
#                                               + lib/index.js + package.json
#   矩阵：linux/windows/macos × amd64/arm64/x86；macos 无 x86（macOS 自 2018 无 32 位
#   工具链）。windows-arm64 用 windows-11-vs2026-arm（公开仓库免费，ARM64 原生）。
#   napi：仅 amd64/x86 提供（ARM64 交叉 Node 插件需对应架构工具链，暂不打包）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   runner: ubuntu-latest,        os: linux,   arch: amd64, native: true,  napi: true }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm,     os: linux,   arch: arm64, native: true,  napi: true }
          - { name: linux-x86,     runner: ubuntu-latest,        os: linux,   arch: x86,   native: false, napi: true, multilib: '1' }
          - { name: windows-amd64, runner: windows-latest,       os: windows, arch: amd64, native: true,  napi: true,  msystem: MINGW64 }
          - { name: windows-x86,   runner: windows-latest,       os: windows, arch: x86,   native: false, napi: true,  msystem: MINGW32 }
          - { name: windows-arm64, runner: windows-11-vs2026-arm, os: windows, arch: arm64, native: true,  napi: false }
          - { name: macos-amd64,   runner: macos-13,             os: macos,   arch: amd64, native: true,  napi: true }
          - { name: macos-arm64,   runner: macos-14,             os: macos,   arch: arm64, native: true,  napi: true }
    env:
      OST: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dependency versions (config.yml)
        shell: bash
        run: python scripts/export-config.py >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: matrix.napi == true
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------- 系统构建依赖 ----------------
      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          set -e
          sudo apt-get update
          if [ "${{ matrix.multilib }}" = "1" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib cmake xvfb pkg-config \
              libglfw3-dev:i386 libfreetype6-dev:i386
          else
            sudo apt-get install -y cmake libglfw3-dev libfreetype6-dev xvfb
          fi

      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows' && matrix.napi == true
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.arch == 'x86' && 'mingw-w64-i686-toolchain mingw-w64-i686-make' || 'mingw-w64-x86_64-toolchain mingw-w64-x86_64-make' }}

      - name: macOS deps
        if: matrix.os == 'macos'
        run: brew install cmake glfw freetype

      # ---------------- third_party（Windows x64/x86 需下载；arm64 核心包仅头文件） ----------------
      - name: Fetch GLFW + GLAD (Windows)
        if: matrix.os == 'windows' && matrix.arch != 'arm64'
        shell: pwsh
        run: |
          $third = Join-Path (Get-Location) 'third_party'
          New-Item -ItemType Directory -Force -Path $third | Out-Null
          $glUrl = "https://github.com/glfw/glfw/releases/download/$env:GLFW_VERSION"
          foreach ($p in @('WIN64', 'WIN32')) {
            $z = Join-Path $env:RUNNER_TEMP "glfw-$p.zip"
            Invoke-WebRequest "$glUrl/glfw-$env:GLFW_VERSION.bin.$p.zip" -OutFile $z
            $ex = Join-Path $env:RUNNER_TEMP "glfw-$p"
            Expand-Archive $z -DestinationPath $ex -Force
            $root = (Get-ChildItem $ex -Directory | Select-Object -First 1).FullName
            if (-not (Test-Path (Join-Path $third 'glfw\include\GLFW'))) {
              New-Item -ItemType Directory -Force -Path (Join-Path $third 'glfw') | Out-Null
              Copy-Item -Recurse -Force (Join-Path $root 'include\GLFW') (Join-Path $third 'glfw\include')
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3dll.a') $third\glfw\
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\glfw3.dll') $third\glfw\
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3.a') $third\glfw\
              Copy-Item -Force (Join-Path $root 'LICENSE.md') $third\glfw\
            }
          }
          # 32 位构建：全覆盖为 WIN32（i686）库与 DLL
          if ('${{ matrix.arch }}' -eq 'x86') {
            $ex = Join-Path $env:RUNNER_TEMP 'glfw-WIN32'
            $root = (Get-ChildItem $ex -Directory | Select-Object -First 1).FullName
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3dll.a') $third\glfw\
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\glfw3.dll') $third\glfw\
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3.a') $third\glfw\
          }
          # glad（fetch_deps 仅下载 glad；GLFW 已就绪）
          & .\scripts\fetch_deps.ps1 -SkipGLFW -SkipFreeType

      - name: MinGW 工具链入 PATH
        if: matrix.os == 'windows' && matrix.napi == true
        run: echo "C:\msys64\${{ matrix.msystem }}\bin" | Out-File -Append $env:GITHUB_PATH

      # ---------------- 构建 Node 插件 ----------------
      - name: Build napi
        if: matrix.napi == true
        working-directory: napi
        env:
          PKG_CONFIG_LIBDIR: ${{ matrix.arch == 'x86' && '/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '' }}
          CMAKE_JS_EXTRA_ARGS: ${{ matrix.arch == 'x86' && '-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32' || '' }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test napi (native)
        if: matrix.napi == true && matrix.native == true
        working-directory: napi
        shell: bash
        run: |
          if [ "$OST" = "linux" ]; then xvfb-run -a npm test; else npm test; fi

      # ---------------- 打包 ----------------
      - name: Package core
        shell: bash
        run: |
          mkdir -p dist/core
          cp -f README.md CMakeLists.txt dist/core/
          cp -r include dist/core/
          if [ -d third_party/glfw/include ] && [ "$ARCH" != "arm64" ]; then
            mkdir -p dist/core/third_party/glfw
            cp -r third_party/glfw/include dist/core/third_party/glfw/include
            cp -r third_party/glad/include dist/core/third_party/glad/
            cp -f third_party/glfw/glfw3.dll third_party/glfw/libglfw3dll.a dist/core/third_party/glfw/ || true
          fi
          tar -C dist/core -czf wbwopenglapi-$OST-$ARCH.tar.gz .

      - name: Package napi
        if: matrix.napi == true
        working-directory: napi
        shell: bash
        run: |
          tar -czf ../wbwopenglapi-napi-$OST-$ARCH.tar.gz build lib package.json

      - uses: actions/upload-artifact@v4
        with:
          name: wbw-core-${{ matrix.os }}-${{ matrix.arch }}
          path: wbwopenglapi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.napi == true
        with:
          name: wbw-napi-${{ matrix.os }}-${{ matrix.arch }}
          path: wbwopenglapi-napi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Release (core + napi)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wbw-*
          path: pkgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: pkgs/*.tar.gz
          generate_release_notes: true