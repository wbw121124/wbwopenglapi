# release.yml - 发布工作流
#   触发：推送 v* 标签（如 v0.2.0）或手动 workflow_dispatch。
#   产出（每个平台 3 个包，合并发布到 Releases）：
#     wbwopenglapi-<os>-<arch>.tar.gz         核心包：include/（header-only 库）
#                                               + CMakeLists/README + Windows x64/x86 DLL/导入库
#     wbwopenglapi-napi-<os>-<arch>.tar.gz   Node 插件：build/*.node（+ 平台 DLL）
#                                               + lib/index.js + package.json
#     wbwopenglapi-skia-<os>-<arch>.tar.gz   Skia 库包：LLVM(clang/clang-cl) 构建的
#                                               skia 库+头 + wbwopenglapi.hpp/_skia.hpp（自包含）
#   矩阵：linux/windows/macos × amd64/arm64/x86；macos 无 x86（macOS 自 2018 无 32 位
#   工具链）。windows-arm64 用 windows-11-vs2026-arm（公开仓库免费，ARM64 原生）。
#   Skia 说明：vcpkg skia 端口不支持 mingw（skia: !(windows&arm32) & !mingw），
#   Windows 用 LLVM clang-cl + MSVC 运行库，Linux/macOS 用系统 clang；故 Windows
#   各架构的 skia 包实际为 clang-cl 构建。x86 平台的 skia 包标为实验性
#   （continue-on-error），amd64/arm64 为正式产物。
#   napi：仅 amd64/x86 提供（ARM64 交叉 Node 插件需对应架构工具链，暂不打包）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   runner: ubuntu-latest,        os: linux,   arch: amd64, native: true,  napi: true }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm,     os: linux,   arch: arm64, native: true,  napi: true }
          - { name: linux-x86,     runner: ubuntu-latest,        os: linux,   arch: x86,   native: false, napi: true, multilib: '1' }
          - { name: windows-amd64, runner: windows-latest,       os: windows, arch: amd64, native: true,  napi: true,  msystem: MINGW64 }
          - { name: windows-x86,   runner: windows-latest,       os: windows, arch: x86,   native: false, napi: true,  msystem: MINGW32 }
          - { name: windows-arm64, runner: windows-11-vs2026-arm, os: windows, arch: arm64, native: true,  napi: false }
          - { name: macos-amd64,   runner: macos-13,             os: macos,   arch: amd64, native: true,  napi: true }
          - { name: macos-arm64,   runner: macos-14,             os: macos,   arch: arm64, native: true,  napi: true }
    env:
      OST: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.napi == 'true'
        with:
          node-version: 20

      # ---------------- 系统构建依赖 ----------------
      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          set -e
          sudo apt-get update
          if [ "${{ matrix.multilib }}" = "1" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib cmake xvfb pkg-config \
              libglfw3-dev:i386 libfreetype6-dev:i386
          else
            sudo apt-get install -y cmake libglfw3-dev libfreetype6-dev xvfb
          fi

      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows' && matrix.napi == 'true'
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.arch == 'x86' && 'mingw-w64-i686-toolchain mingw-w64-i686-make' || 'mingw-w64-x86_64-toolchain mingw-w64-x86_64-make' }}

      - name: macOS deps
        if: matrix.os == 'macos'
        run: brew install cmake glfw freetype

      # ---------------- third_party（Windows x64/x86 需下载；arm64 核心包仅头文件） ----------------
      - name: Fetch GLFW + GLAD (Windows)
        if: matrix.os == 'windows' && matrix.arch != 'arm64'
        shell: pwsh
        run: |
          $third = Join-Path (Get-Location) 'third_party'
          New-Item -ItemType Directory -Force -Path $third | Out-Null
          $glUrl = 'https://github.com/glfw/glfw/releases/download/3.4'
          foreach ($p in @('WIN64', 'WIN32')) {
            $z = Join-Path $env:RUNNER_TEMP "glfw-$p.zip"
            Invoke-WebRequest "$glUrl/glfw-3.4.bin.$p.zip" -OutFile $z
            $ex = Join-Path $env:RUNNER_TEMP "glfw-$p"
            Expand-Archive $z -DestinationPath $ex -Force
            $root = (Get-ChildItem $ex -Directory | Select-Object -First 1).FullName
            if (-not (Test-Path (Join-Path $third 'glfw\include\GLFW'))) {
              New-Item -ItemType Directory -Force -Path (Join-Path $third 'glfw') | Out-Null
              Copy-Item -Recurse -Force (Join-Path $root 'include\GLFW') (Join-Path $third 'glfw\include')
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3dll.a') $third\glfw\
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\glfw3.dll') $third\glfw\
              Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3.a') $third\glfw\
              Copy-Item -Force (Join-Path $root 'LICENSE.md') $third\glfw\
            }
          }
          # 32 位构建：全覆盖为 WIN32（i686）库与 DLL
          if ('${{ matrix.arch }}' -eq 'x86') {
            $ex = Join-Path $env:RUNNER_TEMP 'glfw-WIN32'
            $root = (Get-ChildItem $ex -Directory | Select-Object -First 1).FullName
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3dll.a') $third\glfw\
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\glfw3.dll') $third\glfw\
            Copy-Item -Force (Join-Path $root 'lib-mingw-w64\libglfw3.a') $third\glfw\
          }
          # glad（fetch_deps 仅下载 glad；GLFW 已就绪）
          & .\scripts\fetch_deps.ps1 -SkipGLFW -SkipFreeType

      - name: MinGW 工具链入 PATH
        if: matrix.os == 'windows' && matrix.napi == 'true'
        run: echo "C:\msys64\${{ matrix.msystem }}\bin" | Out-File -Append $env:GITHUB_PATH

      # ---------------- 构建 Node 插件 ----------------
      - name: Build napi
        if: matrix.napi == 'true'
        working-directory: napi
        env:
          PKG_CONFIG_LIBDIR: ${{ matrix.arch == 'x86' && '/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '' }}
          CMAKE_JS_EXTRA_ARGS: ${{ matrix.arch == 'x86' && '-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32' || '' }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test napi (native)
        if: matrix.napi == 'true' && matrix.native == 'true'
        working-directory: napi
        shell: bash
        run: |
          if [ "$OST" = "linux" ]; then xvfb-run -a npm test; else npm test; fi

      # ---------------- 打包 ----------------
      - name: Package core
        shell: bash
        run: |
          mkdir -p dist/core
          cp -f README.md CMakeLists.txt dist/core/
          cp -r include dist/core/
          if [ -d third_party/glfw/include ] && [ "$ARCH" != "arm64" ]; then
            mkdir -p dist/core/third_party/glfw
            cp -r third_party/glfw/include dist/core/third_party/glfw/include
            cp -r third_party/glad/include dist/core/third_party/glad/
            cp -f third_party/glfw/glfw3.dll third_party/glfw/libglfw3dll.a dist/core/third_party/glfw/ || true
          fi
          tar -C dist/core -czf wbwopenglapi-$OST-$ARCH.tar.gz .

      - name: Package napi
        if: matrix.napi == 'true'
        working-directory: napi
        shell: bash
        run: |
          tar -czf ../wbwopenglapi-napi-$OST-$ARCH.tar.gz build lib package.json

      - uses: actions/upload-artifact@v4
        with:
          name: wbw-core-${{ matrix.os }}-${{ matrix.arch }}
          path: wbwopenglapi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.napi == 'true'
        with:
          name: wbw-napi-${{ matrix.os }}-${{ matrix.arch }}
          path: wbwopenglapi-napi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ============================================================
  # Skia 库包（LLVM 构建，独立 job：失败不影响核心/napi 产物；
  # x86 平台 continue-on-error 标记实验性）
  # ============================================================
  skia:
    name: skia-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.exp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   runner: ubuntu-latest,         os: linux,   arch: amd64, triplet: x64-linux,   exp: false, windows: false }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm,      os: linux,   arch: arm64, triplet: arm64-linux,  exp: false, windows: false }
          - { name: linux-x86,     runner: ubuntu-latest,         os: linux,   arch: x86,   triplet: x86-linux,    exp: true,  windows: false }
          - { name: windows-amd64, runner: windows-latest,        os: windows, arch: amd64, triplet: x64-windows,   exp: false, windows: true }
          - { name: windows-x86,   runner: windows-latest,        os: windows, arch: x86,   triplet: x86-windows,   exp: true,  windows: true }
          - { name: windows-arm64, runner: windows-11-vs2026-arm, os: windows, arch: arm64, triplet: arm64-windows, exp: false, windows: true }
          - { name: macos-amd64,   runner: macos-13,              os: macos,   arch: amd64, triplet: x64-osx,      exp: false, windows: false }
          - { name: macos-arm64,   runner: macos-14,              os: macos,   arch: arm64, triplet: arm64-osx,     exp: false, windows: false }
    env:
      OST: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux deps (clang / x86 multilib)
        if: matrix.os == 'linux'
        run: |
          set -e
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y clang gcc-multilib g++-multilib libc6-dev-i386
          else
            sudo apt-get install -y clang
          fi

      - name: Add LLVM to PATH (Windows)
        if: matrix.windows == 'true'
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Checkout vcpkg + cache
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: skia-${{ matrix.triplet }}-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          save-always: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        if: matrix.os == 'windows'
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        if: matrix.os != 'windows'

      # LLVM 工具链（用户要求 Skia 用 llvm 构建）：
      #   Windows: clang-cl（LLVM + MSVC 运行库，vcpkg skia 端口不支持 mingw）
      #   Linux x86: clang + -m32 交叉；其余: 系统 clang
      - name: Prepare clang toolchain file
        shell: bash
        run: |
          if [ "${{ matrix.windows }}" = "true" ]; then
            cat > toolchain.cmake <<'EOF'
          set(CMAKE_C_COMPILER "clang-cl")
          set(CMAKE_CXX_COMPILER "clang-cl")
          set(CMAKE_MT "mt")
          EOF
          elif [ "${{ matrix.arch }}" = "x86" ]; then
            cat > toolchain.cmake <<'EOF'
          set(CMAKE_C_COMPILER "clang")
          set(CMAKE_CXX_COMPILER "clang++")
          set(CMAKE_C_FLAGS "-m32")
          set(CMAKE_CXX_FLAGS "-m32")
          EOF
          else
            cat > toolchain.cmake <<'EOF'
          set(CMAKE_C_COMPILER "clang")
          set(CMAKE_CXX_COMPILER "clang++")
          EOF
          fi
          cat toolchain.cmake

      - name: vcpkg install skia (clang-cl, manifest)
        shell: pwsh
        env:
          VCPKG_CHAINLOAD_TOOLCHAIN_FILE: ${{ github.workspace }}/toolchain.cmake
        run: .\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }}
        if: matrix.os == 'windows'
      - name: vcpkg install skia (clang, manifest)
        env:
          VCPKG_CHAINLOAD_TOOLCHAIN_FILE: ${{ github.workspace }}/toolchain.cmake
        run: ./vcpkg/vcpkg install --triplet ${{ matrix.triplet }}
        if: matrix.os != 'windows'

      - name: Package skia
        shell: bash
        run: |
          mkdir -p dist/skia/skia
          cp -f include/wbwopenglapi.hpp include/wbwopenglapi_skia.hpp dist/skia/
          cp -r vcpkg_installed/${{ matrix.triplet }}/include dist/skia/skia/include
          cp -r vcpkg_installed/${{ matrix.triplet }}/lib dist/skia/skia/lib
          if [ -d vcpkg_installed/${{ matrix.triplet }}/bin ]; then
            cp -r vcpkg_installed/${{ matrix.triplet }}/bin dist/skia/skia/bin
          fi
          cat > dist/skia/README-SKIA.md <<'EOF'
          # wbwopenglapi-skia (LLVM 构建)
          # 内容: wbwopenglapi.hpp / wbwopenglapi_skia.hpp（可选软件栅格化后端封装）
          #      + skia/{include,lib,bin}（vcpkg skia 端口全量构建产物，clang/clang-cl）
          # 用法（Windows 示例，MSVC/clang-cl + CMake）:
          #   add_executable(app app.cpp)
          #   target_include_directories(app PRIVATE skia/include)
          #   target_compile_definitions(app PRIVATE WBWOPENGAL_API_SKIA)
          #   target_link_libraries(app PRIVATE skia/lib/skia.lib)
          #   # 动态库需将 skia/bin/*.dll 置于运行目录
          # 坐标/API 见 wbwopenglapi_skia.hpp 头部说明与 README.md "Skia（可选）" 章节。
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wbw-skia-${{ matrix.os }}-${{ matrix.arch }}
          path: wbwopenglapi-skia-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [build, skia]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wbw-*
          path: pkgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: pkgs/*.tar.gz
          generate_release_notes: true